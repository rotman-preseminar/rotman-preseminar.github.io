# Seminars for the 2026-27 academic year. One file per year: for a new year, create
# data/schedule/2027-28.yml; older years stay on the site under their own tab.
#
# One entry per seminar. Order does not matter; the site sorts by date.
#
# Required:  date (YYYY-MM-DD), speaker
# Optional:  affiliation, speaker_url, paper, paper_url, slides_url, coauthors,
#            presenter (the PhD student discussing the paper),
#            faculty (list of faculty attending the pre-seminar),
#            preseminar: {date, time, room}   -> overrides data/site.yml defaults
#            seminar:    {time, room}
#            notes, cancelled: true
#
# Files: put the paper, discussion slides, etc. in  sessions/<id>/
# where <id> is the session date, e.g. sessions/2026-10-30/
# A file whose name contains "slides"/"discussion" gets the Slides button, "paper" the Paper
# button; any other file gets a button with its own name.
# Instead of uploading, you can link: paper_url / slides_url.
#
# Papers and presenters are TBA until students sign up.

